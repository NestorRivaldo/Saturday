spring.application.name=BalancedScorecardApp

# Base de datos H2 en memoria (portable, arranca de inmediato sin configuracion externa)
spring.datasource.url=jdbc:h2:mem:bscdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Detalle de errores (util en desarrollo)
server.error.include-message=always
server.error.include-binding-errors=always
